<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Pedidos iFood (Corte & Foto)</title>
  
  <!-- CSS do CropperJS para seleção da área -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f4f6;
      color: #333;
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      color: #ea1d2c;
    }

    header p {
      font-size: 0.9rem;
      color: #666;
    }

    .manual-input-box {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
    }

    .manual-input-box input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pedidos-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-pedido {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 6px solid #ffaa00;
    }

    .card-pedido.concluido {
      border-left-color: #2e7d32;
      opacity: 0.75;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header .title {
      font-weight: bold;
      font-size: 1rem;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge.pendente {
      background: #fff3cd;
      color: #856404;
    }

    .badge.concluido {
      background: #d4edda;
      color: #155724;
    }

    .localizador-code {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #111;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    .btn-confirmar {
      background: #ea1d2c;
      color: #fff;
    }

    .btn-confirmar:active {
      background: #c6111e;
    }

    .btn-excluir {
      background: #f1f1f1;
      color: #cc0000;
      flex: 0 0 44px;
    }

    .footer-actions {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
    }

    .btn-escanear-fixo {
      width: 100%;
      padding: 16px;
      background: #ea1d2c;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(234, 29, 44, 0.4);
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: #888;
      margin-top: 40px;
    }

    /* Modal para Cortar a Imagem */
    #crop-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1500;
      flex-direction: column;
    }

    .crop-container {
      flex: 1;
      position: relative;
      background: #000;
      max-height: 80vh;
    }

    .crop-container img {
      max-width: 100%;
      display: block;
    }

    .crop-actions {
      padding: 16px;
      display: flex;
      gap: 12px;
      background: #111;
    }

    .btn-cancelar {
      background: #444;
      color: white;
    }

    #loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid #ea1d2c;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>📸 Pedidos iFood (Seleção Rápida)</h1>
    <p>Tire a foto e selecione a área do localizador</p>
  </header>

  <div class="manual-input-box">
    <input type="number" id="manualCode" placeholder="Digitar 8 dígitos..." maxlength="8" />
    <button class="btn btn-confirmar" style="flex:0 0 auto; padding:0 16px;" onclick="addManual()">+ Add</button>
  </div>

  <div class="section-title">
    <span>PEDIDOS PARA FINALIZAR</span>
    <button onclick="limparConcluidos()" style="background:none; border:none; color:#888; font-size:0.8rem; text-decoration:underline;">Limpar Concluídos</button>
  </div>

  <div class="pedidos-list" id="pedidosList"></div>

  <div class="footer-actions">
    <button class="btn-escanear-fixo" onclick="abrirCameraFoto()">📸 TIRAR FOTO DA COMANDA</button>
  </div>

  <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display: none;" onchange="carregarImagemParaCorte(event)" />

  <!-- Tela de Recorte da Foto -->
  <div id="crop-modal">
    <div class="crop-container">
      <img id="image-to-crop" src="" alt="Comanda" />
    </div>
    <div class="crop-actions">
      <button class="btn btn-cancelar" onclick="fecharCropModal()">Cancelar</button>
      <button class="btn btn-confirmar" onclick="processarCorte()">🔍 LER CÓDIGO CORTADO</button>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Lendo seleção...</p>
  </div>

  <!-- Scripts: CropperJS + TesseractJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const IFOOD_CONFIRM_URL = "https://confirmacao-entrega-propria.ifood.com.br/"; 
    let cropper = null;

    let pedidos = JSON.parse(localStorage.getItem('ifood_pedidos_foto')) || [];

    function salvar() {
      localStorage.setItem('ifood_pedidos_foto', JSON.stringify(pedidos));
      render();
    }

    function render() {
      const container = document.getElementById('pedidosList');
      container.innerHTML = '';

      if (pedidos.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Nenhum pedido escaneado ainda.</p><p>Toque abaixo em "TIRAR FOTO DA COMANDA"</p></div>`;
        return;
      }

      pedidos.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = `card-pedido ${p.status === 'concluido' ? 'concluido' : ''}`;
        
        card.innerHTML = `
          <div class="card-header">
            <span class="title">Pedido #${pedidos.length - index}</span>
            <span class="badge ${p.status}">${p.status === 'pendente' ? '🟢 Pendente' : '✅ Concluído'}</span>
          </div>
          <div class="localizador-code">${p.codigo}</div>
          <div class="card-actions">
            <button class="btn btn-confirmar" onclick="confirmarEntrega(${index})">
              🚀 CONFIRMAR ENTREGA
            </button>
            <button class="btn btn-excluir" onclick="excluirPedido(${index})" title="Excluir">
              🗑️
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function adicionarCodigo(codigo) {
      const codLimpo = codigo.replace(/\D/g, '');
      if (codLimpo.length !== 8) return;

      if (pedidos.some(p => p.codigo === codLimpo)) {
        alert('Este código já foi adicionado à lista.');
        return;
      }

      pedidos.unshift({
        id: Date.now(),
        codigo: codLimpo,
        status: 'pendente'
      });

      salvar();
    }

    function addManual() {
      const input = document.getElementById('manualCode');
      if (input.value.length === 8) {
        adicionarCodigo(input.value);
        input.value = '';
      } else {
        alert('O código do localizador deve conter exatamente 8 números.');
      }
    }

    async function confirmarEntrega(index) {
      const pedido = pedidos[index];
      
      try {
        await navigator.clipboard.writeText(pedido.codigo);
      } catch (err) {
        const textArea = document.createElement("textarea");
        textArea.value = pedido.codigo;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
      }

      pedidos[index].status = 'concluido';
      salvar();

      window.open(IFOOD_CONFIRM_URL, '_blank');
    }

    function excluirPedido(index) {
      pedidos.splice(index, 1);
      salvar();
    }

    function limparConcluidos() {
      pedidos = pedidos.filter(p => p.status === 'pendente');
      salvar();
    }

    function abrirCameraFoto() {
      document.getElementById('fotoInput').click();
    }

    function carregarImagemParaCorte(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const image = document.getElementById('image-to-crop');
        image.src = e.target.result;

        document.getElementById('crop-modal').style.display = 'flex';

        if (cropper) {
          cropper.destroy();
        }

        // Inicializa a caixinha de corte interativa
        cropper = new Cropper(image, {
          viewMode: 1,
          autoCropArea: 0.5,
          responsive: true
        });
      };

      reader.readAsDataURL(file);
    }

    function fecharCropModal() {
      document.getElementById('crop-modal').style.display = 'none';
      document.getElementById('fotoInput').value = '';
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    }

    async function processarCorte() {
      if (!cropper) return;

      const loading = document.getElementById('loading-overlay');
      loading.style.display = 'flex';

      // Pega apenas o pedaço de imagem selecionado na caixinha
      const canvas = cropper.getCroppedCanvas({
        maxWidth: 800,
        maxHeight: 800
      });

      fecharCropModal();

      try {
        // Processa o OCR exclusivamente no retângulo recortado
        const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
        const númerosEncontrados = text.replace(/\D/g, '');

        // Tenta achar exatamente a sequência de 8 dígitos
        const match = númerosEncontrados.match(/\d{8}/);

        if (match) {
          adicionarCodigo(match[0]);
          if (navigator.vibrate) navigator.vibrate(200);
        } else if (númerosEncontrados.length >= 8) {
          // Se capturou os 8 números mesmo com algum caractere extra
          adicionarCodigo(númerosEncontrados.substring(0, 8));
          if (navigator.vibrate) navigator.vibrate(200);
        } else {
          alert('⚠️ Não encontramos os 8 dígitos na área recortada. Ajuste o quadrado cobrindo bem os números.');
        }
      } catch (err) {
        alert('Erro ao processar a imagem cortada.');
      } finally {
        loading.style.display = 'none';
      }
    }

    render();
  </script>
</body>
</html>
